# mod-dungeon-clear headless-sim test suite (Tier 1 + gated Tier 2).
#
# Lives in THIS module repo so module PRs/pushes trigger it. mod-dungeon-clear is
# a playerbots extension and the dungeon_clear_tests target links the full core
# `game` lib, so CI must assemble a complete tree: clone the playerbots core fork,
# drop in mod-playerbots, drop in this module, then build just the test target.
#
# The pins live in the job matrix below, one leg per pin set this branch must
# build on. `deployed` is what the image is built from today (the infra
# UPSTREAM-PINS core and mod-playerbots SHAs), and must pass. `previous` is the
# pin set before it (the fork core before the 2026-10 catch-up); it is allowed
# to fail (continue-on-error), so a break there is visible without blocking.
# Move both legs when the pins move.
env:
  CORE_REPO: mod-playerbots/azerothcore-wotlk   # playerbots core fork
  # ccache is the whole game: a warm cache turns the ~1h cold build into mostly
  # cache hits. Pin CCACHE_DIR so it matches the cache action's path exactly
  # (ccache 4.x on ubuntu-22.04 otherwise defaults to ~/.cache/ccache, which is
  # why the previous run cached nothing). BASEDIR rewrites absolute paths for
  # content hashing so hits survive a fresh checkout; content compilercheck keeps
  # hits stable across runner image bumps.
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: "2G"
  CCACHE_COMPILERCHECK: content

on:
  push:
    branches: [ master, quadseven/prod ]
  pull_request:
  workflow_dispatch:   # allow manual runs

concurrency:
  group: dc-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dc-fast:
    runs-on: ubuntu-22.04
    name: dc-fast (gtest, ${{ matrix.pins }})
    timeout-minutes: 120
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - pins: deployed
            core_ref: 8a4e76eac8c4ccebf547113afe7b51d6c3e91641
            playerbots_repo: quadseven/mod-playerbots
            playerbots_ref: 40884e9c135c1daf27ffd894a6047502a5701130
            allow_failure: false
          - pins: previous
            core_ref: 7f12e89ee5f467a50e62eba1d525eac7dc953d03
            playerbots_repo: quadseven/mod-playerbots
            playerbots_ref: 7a593fa254840221f1d63b7beb8d9735e55309ba
            allow_failure: true
    steps:
      # 1. Assemble the tree: core at the workspace root, modules underneath.
      - name: Checkout core (${{ env.CORE_REPO }}@${{ matrix.core_ref }})
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ matrix.core_ref }}
          path: .

      - name: Checkout mod-playerbots (${{ matrix.playerbots_repo }}@${{ matrix.playerbots_ref }})
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ matrix.playerbots_repo }}
          ref: ${{ matrix.playerbots_ref }}
          path: modules/mod-playerbots

      - name: Checkout this module (PR ref)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: modules/mod-dungeon-clear

      # 2. Cheap, build-free gates first.
      - name: Completion loot replay
        run: python3 -B modules/mod-dungeon-clear/tools/replay_completion_key_loot.py

      - name: Determinism lint
        run: bash modules/mod-dungeon-clear/tools/check_determinism.sh

      - name: Config-read lint
        run: python3 modules/mod-dungeon-clear/tools/check_config_reads.py

      # Every build we run is clang-on-glibc, so MSVC-only breakage (M_PI and
      # friends) ships undetected. windows-smoke.yml compiles for real; this is
      # the one-second version that fails the PR before anyone waits on it.
      - name: MSVC portability lint
        run: python3 modules/mod-dungeon-clear/tools/check_msvc_portability.py

      # 3. Build the core deps + the test target. ccache makes repeat runs cheap.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install ccache mold clang cmake make build-essential \
            libmysqlclient-dev libssl-dev libbz2-dev libreadline-dev \
            libncurses-dev libboost-all-dev google-perftools

      # Unique key per run so the cache ALWAYS saves (actions/cache skips the save
      # on an exact-key hit); restore-keys fall back to the most recent cache for
      # this pin set and branch, then this pin set, then anything. This is what
      # keeps the cache fresh as code changes instead of freezing after the first
      # save. Restore and save are split so a build that FAILS still saves what
      # it compiled: otherwise every retry of a broken cold build starts cold.
      - name: ccache (restore)
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: dc-tests-ccache:${{ matrix.pins }}:${{ github.ref_name }}:${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dc-tests-ccache:${{ matrix.pins }}:${{ github.ref_name }}:
            dc-tests-ccache:${{ matrix.pins }}:
            dc-tests-ccache:

      # Optional: a private, never-committed navmesh slice so the Tier-2 nav suite
      # runs instead of skipping. Populate this cache key from your own data; absent
      # it, the nav suite GTEST_SKIPs and Tier 1 still runs.
      - name: Restore map-data slice (optional)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        continue-on-error: true
        with:
          path: modules/mod-dungeon-clear/t/fixtures/mapdata
          key: dc-mapdata:v1

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_TESTING=ON \
            -DSCRIPTS=static -DMODULES=static \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=mold" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=mold" \
            -DCMAKE_MODULE_LINKER_FLAGS="-fuse-ld=mold" \
            -DNOPCH=1

      - name: Build dungeon_clear_tests
        run: |
          ccache --zero-stats
          cmake --build build --target dungeon_clear_tests -j"$(nproc)"
          echo "::group::ccache stats (high hit ratio == warm cache)"
          ccache --show-stats
          echo "::endgroup::"

      - name: ccache (save)
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: dc-tests-ccache:${{ matrix.pins }}:${{ github.ref_name }}:${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run suite
        working-directory: build
        run: |
          ./dungeon_clear_tests \
            --gtest_filter='*DungeonClear*:Dc*:RoomAggro*:BossRoster*:DungeonEvent*:EventBuilder*' \
            --gtest_output=xml:dc_tests.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dc-tests-results-${{ matrix.pins }}
          path: build/dc_tests.xml
          if-no-files-found: ignore
