# The lane pre-PR check: the lint steps and the Build step the
# pull-request workflows run (.github/workflows/tests.yml). In CI the
# module is checked out nested at modules/mod-dungeon-clear/ under the
# core tree, so the workflow commands carry that path prefix; here the
# tree root is the module itself, so the same scripts run from tools/
# (each one resolves its own location, so they run from anywhere).
#
# Listed: the Build step of tests.yml, as the test line below. It builds
# the test target in the assembled, configured tree the workflow's
# Configure step prepares (the core tree plus mod-playerbots, about an
# hour of build on a cold cache), so it runs where that tree exists, as
# it does in CI. It needs no secrets, simulators or unset variables.
#
# Not listed: the Configure and Run suite steps of tests.yml and the
# MSVC compile of windows-smoke.yml. windows-smoke.yml also only
# triggers on pull requests that touch src/**, t/** or CMake files, so it
# does not run for this ticket's pull request, and its steps are
# Windows-only.
lint | bash tools/check_determinism.sh | .github/workflows/tests.yml | Determinism lint
lint | python3 tools/check_config_reads.py | .github/workflows/tests.yml | Config-read lint
lint | python3 tools/check_msvc_portability.py | .github/workflows/tests.yml | MSVC portability lint
test | ccache --zero-stats && cmake --build build --target dungeon_clear_tests -j"$(nproc)" && echo "::group::ccache stats (high hit ratio == warm cache)" && ccache --show-stats && echo "::endgroup::" | .github/workflows/tests.yml | Build dungeon_clear_tests
